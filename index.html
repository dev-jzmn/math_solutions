<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Math Solutions</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <button type="button" id="open-request">
        Request a Problem
    </button>

    <section id="request-problem-section" hidden>
        <h2>Request a Problem</h2>
        <div class="request-row">
            <input type="text" id="request-section" placeholder="Section, e.g. 7.2">
            <input type="number" id="request-problem" placeholder="Problem number">
        </div>
        

        <textarea
            id="request-message"
            placeholder="Optional note..."
        ></textarea>

        <button type="button" id="submit-request">
            Submit Request
        </button>

        <button type="button" id="cancel-request">
            Cancel
        </button>

        <p id="request-status"></p>
    </section>

    <header>
        <h1>Math Solutions</h1>
    </header>

    <form id="problem-search" class="search-bar">
        <input
            type="text"
            id="search-input"
            placeholder="Example: 6.1 #24"
        >
        <button type="submit">Search</button>
    </form>

    <p id="search-message"></p>
    <main>

        <h2>Calculus Stewart 9th edition</h2>

        <section>
            <h2>Chapters</h2>

            <div id="chapter-list"></div>

            <script type="module" src="js/index.js"></script>
        </section>

    </main>

</body>
<script type="module" src="js/search.js"></script>

</html>
