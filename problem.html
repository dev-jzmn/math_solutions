<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['\\(', '\\)']],
                displayMath: [['\\[', '\\]']]
            }
        };
    </script>
</head>
<nav class="breadcrumb">
    <a href="index.html">Home</a>

    <span>›</span>

    <a id="chapter-link"></a>

    <span>›</span>

    <span id="section-name"></span>
</nav>
<h1 id="problem-title"></h1>

<section id="problem-content">
    <p id="problem-prompt"></p>
    <div id="problem-expression"></div>
</section>

<section>
    <button id="hint-button">Show Hint</button>
    <div id="hint-box" class="solution-box" hidden>
        <h2>Hint</h2>
        <p id="hint"></p>
    </div>
</section>

<section>
    <button id="answer-button">Show Answer</button>
    <div id="answer-box" class="solution-box" hidden>
        <h2>Answer</h2>
        <p id="answer"></p>
    </div>
</section>

<section>
    <button id="solution-button">Show Full Solution</button>
    <div id="solution-box" class="solution-box" hidden>
        <h2>Explanation</h2>
        <div id="steps"></div>
    </div>
</section>

<section>
    <h2>Common Mistake</h2>
    <p id="common-mistake"></p>
</section>

<button type="button" id="open-feedback">
    Report an Issue
</button>

<section id="feedback-section" hidden>
    <h2>Report an Issue</h2>

    <select id="feedback-type">
        <option value="solution_issue">Solution error</option>
        <option value="unclear_explanation">Explanation unclear</option>
        <option value="other">Other</option>
    </select>

    <textarea
        id="feedback-message"
        placeholder="Describe the issue..."
    ></textarea>

    <button type="button" id="submit-feedback">
        Submit Feedback
    </button>

    <button type="button" id="cancel-feedback">
        Cancel
    </button>

    <p id="feedback-status"></p>
</section>

<nav class="problem-navigation">
    <a id="previous-problem" href="#">← Previous</a>
    <a id="next-problem" href="#">Next →</a>
</nav>

<!-- do not change the order -->
<!-- math formatting load -->
<script
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>
<script type="module" src="js/problem.js"></script>
</html>
