<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['\\(', '\\)']],
                displayMath: [['\\[', '\\]']]
            }
        };
    </script>
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/jsxgraph/distrib/jsxgraph.css"
    >
    <script
        src="https://cdn.jsdelivr.net/npm/jsxgraph/distrib/jsxgraphcore.js">
    </script>
</head>
<nav class="breadcrumb">
    <a href="index.html">Home</a>

    <span>›</span>

    <a id="chapter-link"></a>

    <span>›</span>

    <span id="section-name"></span>
</nav>

<br>
<button id="search_again">Search Again?</button>

<label id="search_by_label" for="search-type" hidden>
    Search by 
</label>

<select id="search-type" hidden>
    <option value="problem">
        Section & Problem Number
    </option>

    <option value="tag">
        Tag
    </option>
</select>


<form id="search-form" class="search-bar" hidden>

    <div id="problem-search-fields">
        <input
            type="text"
            id="search-input"
            placeholder="e.g. 6.1 #24"
        >
    </div>


    <div id="tag-search-fields" hidden>

        <div class="tag-input-row">
            <input
                type="text"
                id="tag-input"
                placeholder="Search tags..."
                autocomplete="off"
            >
        </div>

        <div id="tag-suggestions" hidden></div>
    </div>

    <button type="submit">
        Search
    </button>

</form>

<div id="search-response" hidden>
    <br>
    <div id="selected-tags"></div>
    <p id="search-message"></p>
</div>

<h1 id="problem-title"></h1>

<section id="problem-content">
    <p id="problem-prompt"></p>
    <div id="problem-expression"></div>
    <div id="problem-diagram" hidden></div>
    <div class="graph-wrapper">
        <div id="problem-graph"
            class="jxgbox graph-box"
            hidden>
        </div>
    </div>
</section>

<section>
    <button id="hint-button">Show Hint</button>
    <div id="hint-box" class="solution-box" hidden>
        <h2>Hint</h2>
        <p id="hint"></p>
    </div>
</section>

<section>
    <button id="answer-button">Show Answer</button>
    <div id="answer-box" class="solution-box" hidden>
        <h2>Answer</h2>
        <p id="answer"></p>
        <div class="graph-wrapper">
            <div
                id="answer-graph"
                class="jxgbox graph-box"
                hidden>
            </div>
        </div>
    </div>
</section>

<section>
    <button id="solution-button">Show Full Solution</button>
    <div id="solution-box" class="solution-box" hidden>
        <h2>Explanation</h2>
        <div id="steps"></div>
    </div>
</section>

<section>
    <h2>Common Mistake</h2>
    <p id="common-mistake"></p>
</section>

<nav class="problem-navigation">
    <a id="previous-problem" href="#">← Previous</a>
    <a id="next-problem" href="#">Next →</a>
</nav>

<br>
<button type="button" id="open-feedback">
    Report an Issue
</button>

<section id="feedback-section" hidden>
    <h2>Report an Issue</h2>

    <select id="feedback-type">
        <option value="solution_issue">Solution error</option>
        <option value="unclear_explanation">Explanation unclear</option>
        <option value="other">Other</option>
    </select>

    <textarea
        id="feedback-message"
        placeholder="Describe the issue..."
    ></textarea>

    <button type="button" id="submit-feedback">
        Submit Feedback
    </button>

    <button type="button" id="cancel-feedback">
        Cancel
    </button>

    <p id="feedback-status"></p>
</section>

<!-- do not change the order -->
<!-- math formatting load -->
<script
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>
<script type="module" src="js/problem.js"></script>
<script type="module" src="js/search.js"></script>
</html>
