<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">

    <title id="page-title"></title>
</head>

<body>

    <nav class="breadcrumb">
        <a href="index.html">Home</a>
        <span>›</span>
        <a id="chapter-title"></a>
    </nav>
    <br>

    <label id="search_by_label" for="search-type">
        Search by 
    </label>

    <select id="search-type">
        <option value="problem">
            Section & Problem Number
        </option>

        <option value="tag">
            Tag
        </option>
    </select>


    <form id="search-form" class="search-bar">

        <div id="problem-search-fields">
            <input
                type="text"
                id="search-input"
                placeholder="e.g. 6.1 #24"
            >
        </div>

    
        <div id="tag-search-fields" hidden>

            <div class="tag-input-row">
                <input
                    type="text"
                    id="tag-input"
                    placeholder="Search tags..."
                    autocomplete="off"
                >
            </div>

            <div id="tag-suggestions" hidden></div>
        </div>

        <button type="submit">
            Search
        </button>

    </form>
    <div id="selected-tags"></div>

    <p id="search-message"></p>

    <h1 id="chapter-title"></h1>

    <div id="chapter-content"></div>

    <script type="module" src="js/chapter.js"></script>
    <script type="module" src="js/search.js"></script>

</body>
</html>
